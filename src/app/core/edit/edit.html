<app-header></app-header>

<section class="header-section">
  <div class="row">
    <div class="col-lg-6">
      <h4>Calendar and Premium Newsletter (Add/Modify)</h4>
    </div>

    <div class="col-lg-6 d-flex justify-content-end header-btn">
      <button
        class="btn"
        *ngFor="let item of menuItems"
        [class.active]="activeItem === item.id"
        (click)="setActive(item.id)"
      >
        {{ item.label }}
      </button>
    </div>
  </div>

  <div *ngIf="isLoading" class="component-loader">
    <span class="loader-dot"></span>
    Loading data...
  </div>
  <div>
    <div *ngIf="activeItem === 1 && grantData">
      <app-calendar-details [data]="grantData"></app-calendar-details>
    </div>

    <app-geo-location *ngIf="grantData" [hidden]="activeItem !== 2" [grantId]="grantData.id">
    </app-geo-location>

    <app-focus-area
      *ngIf="grantData"
      [hidden]="activeItem !== 3"
      [grantId]="grantData.id"
    ></app-focus-area>

    <app-focus-groups
      *ngIf="grantData"
      [hidden]="activeItem !== 4"
      [grantId]="grantData.id"
    ></app-focus-groups>


    <div *ngIf="activeItem === 5">
      <app-counties></app-counties>
    </div>

    <div *ngIf="activeItem === 6">
      <app-seo-social></app-seo-social>
    </div>
  </div>
</section>
